<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>炸金花 · M3/M5 正式 UI（Canvas）</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #0a1224; color: #eef4ef; font-family: "Cascadia Mono", "Consolas", "Noto Sans Mono CJK SC", monospace; }
      /* 竖向预算：画布要拿到 ≥560 高才不触发"窗口太小"（工单 §4 rev=7 的验收窗口是 720×640）。
         所以页面自身的框架必须压到 ~80px 以内：控制条走"紧凑两行"，容器内边距 2px，绝不写死 calc(100vh - N)。
         M5 加了联机控件，靠"两种模式各藏一半"把行数顶回去：单机那五个不联机的看不见，反之亦然。 */
      header { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 4px 10px; background: #101b2c; border-bottom: 1px solid #23324a; font-size: 12px; }
      header h1 { font-size: 13px; margin: 0 8px 0 0; font-weight: 700; }
      header label { color: #9fb3a8; display: flex; gap: 4px; align-items: center; }
      header select, header input { background: #0f1720; color: #eef4ef; border: 1px solid #2b3a48; border-radius: 4px; padding: 1px 4px; font: inherit; }
      header input { width: 6.5em; }
      #netUrl { width: 15em; }
      #netName { width: 7em; }
      header button { background: #2f6f4f; color: #eaf5ee; border: 1px solid #7fd6a8; border-radius: 5px; padding: 2px 10px; font: inherit; cursor: pointer; }
      header a { color: #8fa398; }
      /* 氛围/音效/全屏走"幽灵款"：与主行动按钮（开新一桌/连接）在视觉上分主次 */
      header button.ghost { background: #18222c; color: #9fb3a8; border-color: #2b3a48; }
      header button.ghost:hover { color: #eef4ef; border-color: #7fd6a8; }
      #hint { margin-left: auto; color: #8fa398; }
      /* 成组显隐：display:contents 让 label 仍然直接排在 header 这条 flex 里，收起时整组变 none */
      .solo-only, .online-only { display: contents; }
      body.mode-solo .online-only { display: none; }
      body.mode-online .solo-only { display: none; }
      #stage { position: relative; flex: 1 1 auto; min-height: 0; padding: 2px; display: flex; }
      #board { width: 100%; height: 100%; display: block; background: #10161d; border: 1px solid #24313d; border-radius: 8px; }
      /* 氛围层：纯 DOM 覆盖在 canvas 之上，全部半透明（canvas 的透视地板/罗盘由 scene
         以 line/ellipse 图元绘制——不透明层会盖住整张牌桌，这是实测踩过的坑）。
         组成 = 中央辉光 + 暗角 + 织物肌理（CC0，assets/felt-fabric.jpg）+ 水印 + 金线内框，
         随 body[data-theme] 过渡 240ms；pointer-events:none 不挡任何交互。 */
      #amb { position: absolute; inset: 2px; pointer-events: none; border-radius: 8px; overflow: hidden;
        background:
          radial-gradient(120% 95% at 50% 36%, var(--amb-glow), transparent 62%),
          radial-gradient(150% 130% at 50% 52%, transparent 45%, var(--amb-vignette) 100%);
        box-shadow: inset 0 0 0 1px var(--amb-line), inset 0 0 90px var(--amb-vignette);
        transition: background 0.24s ease, box-shadow 0.24s ease; }
      #amb::before { content: "炸 金 花"; position: absolute; left: 50%; top: 50%; width: max-content;
        transform: translate(-50%, -50%) rotate(-14deg); font-size: min(13vh, 110px); letter-spacing: 0.35em;
        font-weight: 700; color: var(--amb-wm); opacity: 0.05; }
      #amb::after { content: ""; position: absolute; inset: 0; background: url("./assets/felt-fabric.jpg");
        background-size: 220px 220px; opacity: var(--amb-fabric); mix-blend-mode: overlay; }
      body { --amb-glow: rgba(96, 150, 255, 0.10); --amb-vignette: rgba(2, 6, 14, 0.62); --amb-line: rgba(212, 175, 105, 0.35); --amb-wm: #cfe0ff; --amb-fabric: 0.14; }
      body[data-theme="ink"] { --amb-glow: rgba(217, 164, 65, 0.09); --amb-vignette: rgba(5, 4, 2, 0.55); --amb-line: rgba(217, 164, 65, 0.30); --amb-wm: #efe9dc; --amb-fabric: 0.12; }
      body[data-theme="paper"] { --amb-glow: rgba(255, 253, 246, 0.65); --amb-vignette: rgba(94, 84, 60, 0.28); --amb-line: rgba(42, 38, 32, 0.30); --amb-wm: #2a2620; --amb-fabric: 0.18; }
      /* aria-live 播报位：视觉隐藏，读屏器可见 */
      .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .muted { color: #8fa398; }
    </style>
  </head>
  <body class="mode-solo">
    <header>
      <h1>炸金花 · M3</h1>
      <a id="lobbyLink" class="muted" href="./lobby.html">大厅</a>
      <label>模式 <select id="mode"><option value="solo" selected>单机</option><option value="online">联机</option></select></label>
      <span class="solo-only">
        <label>机器人 <select id="bots"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
        <label>牌型 <select id="preset"><option value="classic" selected>classic</option><option value="a23off">a23off</option></select></label>
        <label>庄家 <select id="dealerNext"><option value="rotate" selected>轮庄</option><option value="winner">赢家坐庄</option><option value="loser">输家坐庄</option></select></label>
        <label>种子 <input id="seed" type="number" value="20260925" /></label>
        <button id="newGame">开新一桌</button>
      </span>
      <span class="online-only">
        <label>房间 <input id="netUrl" type="text" placeholder="ws://127.0.0.1:8790" /></label>
        <label>名字 <input id="netName" type="text" placeholder="留空自动起名" /></label>
        <button id="netBtn">连接</button>
        <button id="leaveBtn">离桌</button>
      </span>
      <label>买入 <input id="buyIn" type="number" value="256" min="1" /></label>
      <span id="hint" class="muted">未开局</span>
      <button id="themeBtn" class="ghost" type="button" title="循环切换主题：桌绿 → 墨金 → 月白">主题：桌绿</button>
      <button id="muteBtn" class="ghost" type="button" title="程序化合成音效开/关（快捷键 M）">音效：关</button>
      <button id="fsBtn" class="ghost" type="button" title="全屏 / 退出全屏">全屏</button>
    </header>
    <div id="stage">
      <canvas id="board"></canvas>
      <div id="amb" aria-hidden="true"></div>
    </div>
    <span id="live" class="vh" aria-live="polite"></span>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
