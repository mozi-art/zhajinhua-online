<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>炸金花 · 大厅</title>
    <style>
      :root { color-scheme: dark; }
      /* 与牌桌页同一套天天斗地主外壳：深墨绿底 + 斗地主金强调 + 金底深字主钮。
         字体同样对齐 scene 的 CARD_FONT（圆体黑体）。 */
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        background: radial-gradient(125% 92% at 50% 0%, #0e2b1d 0%, #07120d 60%, #040c08 100%);
        color: #f3f8ef; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", "HarmonyOS Sans SC", sans-serif; }
      header { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
        background: linear-gradient(#152c1f, #0d1b13); border-bottom: 1px solid rgba(255, 197, 61, 0.32); font-size: 13px; }
      header h1 { font-size: 14px; margin: 0; color: #ffc53d; letter-spacing: 0.05em; }
      header a { color: #9db8a6; }
      main { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
      section { background: #12241b; border: 1px solid #2b4a38; border-radius: 10px; padding: 10px 12px;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 8px 22px rgba(0, 0, 0, 0.35); }
      h2 { font-size: 13px; margin: 0 0 8px; color: #9db8a6; }
      button { background: linear-gradient(#ffd968, #f0a52a); color: #23180a; border: 1px solid #b87a12;
        border-radius: 6px; padding: 4px 12px; font: inherit; font-weight: 700; cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 1px 2px rgba(0, 0, 0, 0.4); }
      button:hover { filter: brightness(1.07); }
      input { background: #0c1a12; color: #f3f8ef; border: 1px solid #2b4a38; border-radius: 4px; padding: 3px 6px; font: inherit; width: 6em; text-transform: uppercase; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { padding: 4px 0; border-bottom: 1px dashed #24503a; }
      li a { color: #ffc53d; }
      .muted { color: #9db8a6; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>炸金花 · 大厅</h1>
      <a href="./index.html">回到牌桌</a>
    </header>
    <main>
      <section>
        <div class="row">
          <button id="newRoom">开一张新桌</button>
          <span class="muted">把这一桌的链接发给同一网络里的朋友（房间码 4 位，无 0/1/O/I/L）</span>
        </div>
        <div class="row" style="margin-top: 8px">
          <span>或输入房间码</span>
          <input id="codeInput" maxlength="4" placeholder="AB3K" />
          <button id="joinCode">进入</button>
          <span id="codeNote" class="muted"></span>
        </div>
      </section>
      <section>
        <h2>在座的桌子</h2>
        <ul id="roomList"></ul>
        <p id="listNote" class="muted"></p>
      </section>
    </main>
    <script type="module" src="./lobby.ts"></script>
  </body>
</html>
